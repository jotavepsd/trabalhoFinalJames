<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Administrativa - Últimas Modificações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/produtos">FATEC - Painel Administrativo</a>
    </div>
</nav>

<div class="container">
    <div class="card shadow">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h2 class="mb-0">Controle de Modificações e Estoque</h2>
            <a href="/produtos" class="btn btn-secondary btn-sm">Voltar ao Catálogo</a>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Produto</th>
                        <th>Categoria</th>
                        <th>Valor</th>
                        <th>Qtd. Estoque</th>
                        <th>Última Atualização</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${produtos}"
                        th:classappend="${p.quantidade < 5} ? 'table-danger' : ''">

                        <td th:text="${p.idProduto}"></td>
                        <td th:text="${p.nome}" class="fw-bold"></td>
                        <td th:text="${p.categoria.nome}"></td>
                        <td th:text="'R$ ' + ${p.valor}"></td>

                        <td>
                            <span th:text="${p.quantidade}"></span>
                            <span th:if="${p.quantidade < 5}" class="badge bg-danger ms-2">Baixo Estoque</span>
                        </td>

                        <td th:text="${#temporals.format(p.dataCadastro, 'dd/MM/yyyy HH:mm')}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
